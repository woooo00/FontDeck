<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FontDeck</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: #f6f6f7;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #16161a;
    }
    #frame {
        width: 100%; height: 100%; border: 0; display: none;
    }
    #boot {
        height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 14px; padding: 30px; text-align: center;
    }
    .logo {
        width: 38px; height: 38px; border-radius: 10px;
        background: #4f46e5; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 19px; font-weight: 700;
        letter-spacing: -0.02em;
    }
    h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
    .msg { font-size: 12px; color: #8b8b96; line-height: 1.8; max-width: 300px; }
    .msg code {
        background: #ececf0; padding: 1px 5px; border-radius: 3px;
        font-family: Consolas, monospace; font-size: 11px;
        color: #5c5c66;
    }
    .err { color: #b25d00; }
    .spin {
        width: 18px; height: 18px;
        border: 2px solid #e0e0e6; border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<iframe id="frame" src="about:blank"></iframe>

<div id="boot">
    <div class="logo">F</div>
    <h1>FontDeck</h1>
    <div class="spin" id="spin"></div>
    <div class="msg" id="msg">正在连接字体服务…</div>
</div>

<script src="js/CSInterface.js"></script>
<script src="js/bridge.js"></script>
<script src="js/boot.js?v=4"></script>
</body>
</html>
